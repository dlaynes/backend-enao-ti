# Application identity
spring.application.name=backend-enao
server.port=8080

# Dev profile: H2 in-memory database
spring.datasource.url=jdbc:h2:mem:enao;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.grupo4.enao=DEBUG

# JWT secret (change in production)
enao.jwt.secret=dev-secret-key-for-enao-project-only-do-not-use-in-production
enao.jwt.expiration-ms=86400000
